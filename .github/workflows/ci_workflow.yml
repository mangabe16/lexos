# This workflow is based on the starter template at https://github.com/actions/starter-workflows/blob/main/ci/python-package.yml.
# It will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        uv-version: ["0.7.4"]

    steps:
    - uses: actions/checkout@v4
    - name: Install uv # Set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v5 # actions/setup-python@v3
      with:
        version: ${{ matrix.uv-version }}
        # python-version: ${{ matrix.python-version }}
    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        python-version-file: "pyproject.toml"
    - name: Install the project
      run: uv sync --locked --all-extras --dev

    # The block below caches the workflow to speed up runs.
    # The configuration may not be right. See https://docs.astral.sh/uv/guides/integration/github/#caching
    - name: Define a cache dependency glob
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    # Stop the build if there are Python syntax errors or undefined names
    - name: Lint with Ruff
      run: |
        uvx ruff check --output-format=github .

    - name: Test with pytest
      run: |
        uv run pytest tests --tb=short --disable-warnings -v
