theme:
  name: material
  favicon: http://lexos.wheatoncollege.edu/static/favicon.png
  font:
    text: Roboto
    code: Roboto Mono
  # logo: images/lexos_logo.png
  custom_dir: overrides
  language: en
  # search: true
  features:
    # - navigation.tabs
    - navigation.top
    - navigation.indexes
  icon:
    logo: lexos/dragon
    repo: fontawesome/brands/github
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to light mode

markdown_extensions:
  # - meta
  - admonition
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.magiclink
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.keys
  - attr_list
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: "¤"

copyright: Copyright &copy; 2022- <a href="https://wheatoncollege.edu/academics/special-projects-initiatives/lexomics/" target="_blank">The Lexomics Project</a>

repo_url: https://github.com/scottkleinman/lexos

extra_css:
  - stylesheets/extra.css

# extra_javascript:
# - https://code.jquery.com/jquery-3.6.0.slim.min.js
# - javascripts/mark.es6.min.js

extra:
  social:
    - icon: fontawesome/solid/globe
      link: http://lexos.wheatoncollege.edu/
    # - icon: fontawesome/brands/twitter
    #   link: https://twitter.com/Lexomics
    - icon: fontawesome/brands/github
      link: https://github.com/scottkleinman/uv_lexos/
  analytics:
    provider: google
    property: G-S7XYDZ16KZ

plugins:
  - search
  - autorefs
  - section-index
  - macros
  - mkdocstrings:
      handlers:
        python:
          options:
            # docstring_options:
            #   ignore_init_summary: true
            # docstring_section_style: list
            # filters: ["!^_"]
            heading_level: 1
            inherited_members: true
            merge_init_into_class: false
            separate_signature: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true
            extensions:
            # - griff_fieldz: https://github.com/pyapp-kit/griffe-fieldz
            - griffe_pydantic:
                schema: false