[project]
name = "lexos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Scott Kleinman", email = "scott.kleinman@csun.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.85",
    "bs4>=0.0.2",
    "chardet>=5.2.0",
    "cytoolz>=1.0.1",
    "dotenv>=0.9.9",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.6",
    "javaobj-py3>=0.4.4",
    "little-mallet-wrapper>=0.5.0",
    "matplotlib>=3.10.0",
    "natsort>=8.4.0",
    "nbformat>=5.10.4",
    "pandas>=2.2.3",
    "plotly>=6.0.0",
    "pydantic>=2.10.4",
    "pydantic-extra-types>=2.10.2",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-magic-bin==0.4.14",
    "rich>=13.9.4",
    "seaborn>=0.13.2",
    "smart-open>=7.1.0",
    "sniffio>=1.3.1",
    "spacy>=3.8.3",
    "textacy>=0.13.0",
    "wordcloud>=1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pip>=24.3.1",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.4",
    "setuptools>=75.6.0",
    "wheel>=0.45.1",
]

# [tool.uv.sources]
# xx_sent_ud_sm = { url = "https://github.com/explosion/spacy-models/releases/download/xx_sent_ud_sm-3.8.0/xx_sent_ud_sm-3.8.0.tar.gz" }
# en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz" }

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib", ]
